
<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #4936a5;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-top: 8px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #4936a5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Resume Analyzer</h1>
        <p>Check how well your resume matches a job description.</p>

        <form action="/analyze" method="POST">
            <label for="resume">Paste Your Resume</label>
            <textarea id="resume" name="resume" required
                placeholder="Paste your resume text here..."></textarea>

            <label for="job">Paste Job Description</label>
            <textarea id="job" name="job" required
                placeholder="Paste the job requirements here..."></textarea>

            <button type="submit">Analyze Resume</button>
        </form>
    </div>
</body>
</html>
